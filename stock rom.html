<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Device Download</title>

<style>
    body {
        font-family: Arial;
    }

    .search-box {
        text-align: center;
        margin-top: 20px;
    }

    .search-box input {
        padding: 10px;
        width: 250px;
        border-radius: 5px;
        border: 1px solid #ccc;
    }

    .container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        margin-top: 30px;
    }

    .device {
        width: 200px;
        border: 1px solid #ccc;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
    }

    .btn {
        margin-top: 10px;
        padding: 8px 15px;
        background-color: green;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .btn:hover {
        background-color: darkgreen;
    }
</style>

<script>
function searchDevice() {
    let input = document.getElementById("search").value.toLowerCase();
    let devices = document.getElementsByClassName("device");

    for (let i = 0; i < devices.length; i++) {
        let name = devices[i].getElementsByTagName("h3")[0].innerText.toLowerCase();

        if (name.includes(input)) {
            devices[i].style.display = "block";
        } else {
            devices[i].style.display = "none";
        }
    }
}
</script>

</head>
<body>

<div class="search-box">
    <input type="text" id="search" onkeyup="searchDevice()" placeholder="Search device...">
</div>

<div class="container">

   <div class="device" data-name="nokia 6.1 plus drg">
    <h3>Nokia 6.1 Plus</h3>
    <p>(Codename: DRG)</p>

    <a href="https://github.com/rahulkumarmy/HKLA-X/releases/download/android/twrp-3.6.2_9-0-DRG_sprout.img" download>
        <button class="btn">Twrp.img</button>
    </a>

    <a href="https://github.com/rahulkumarmy/HKLA-X/releases/download/android/twrp-installer-3.6.2_9-0-DRG_sprout.zip" download>
        <button class="btn">Twrp.zip</button>
    </a>
</div>

    <div class="device">
        <h3>iPhone</h3>
        <a href="file2.zip" download>
            <button class="btn">Download</button>
        </a>
    </div>

    <div class="device">
        <h3>OnePlus</h3>
        <a href="file3.zip" download>
            <button class="btn">Download</button>
        </a>
    </div>

</div>

</body>
</html>
