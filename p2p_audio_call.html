<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Audio Call - Serverless</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 2rem;
        }

        .status-badge {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        /* Your Number Display */
        .your-number {
            text-align: center;
            margin: 2rem 0;
            padding: 2rem;
            background: #f5f5f5;
            border-radius: 12px;
        }

        .your-number-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .your-number-display {
            font-size: 56px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            letter-spacing: 16px;
            color: #667eea;
        }

        /* Dial Section */
        .dial-section {
            margin: 2rem 0;
        }

        .dial-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .dial-input {
            width: 100%;
            padding: 16px;
            font-size: 24px;
            font-weight: 600;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            text-align: center;
            letter-spacing: 8px;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }

        .dial-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        /* Dial Buttons (Keypad) */
        .dial-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 16px;
        }

        .dial-btn {
            padding: 18px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #333;
        }

        .dial-btn:hover {
            background: #eeeeee;
            border-color: #bbb;
            transform: translateY(-2px);
        }

        .dial-btn:active {
            transform: scale(0.95);
        }

        .dial-btn.delete {
            grid-column: 1 / -1;
            background: #ffebee;
            color: #c62828;
            border-color: #ffcdd2;
            font-size: 14px;
        }

        .dial-btn.delete:hover {
            background: #ffcdd2;
        }

        /* Call Action Buttons */
        .call-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .call-btn {
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .call-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            grid-column: 1 / -1;
        }

        .call-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .call-btn.primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .call-btn.secondary {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .call-btn.secondary:hover {
            background: #ffcdd2;
        }

        /* Call Status */
        .call-status {
            display: none;
            padding: 20px;
            background: #e8f5e9;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
        }

        .call-status.active {
            background: #e8f5e9;
        }

        .call-status-text {
            font-size: 16px;
            color: #2e7d32;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .timer {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
            font-family: 'Courier New', monospace;
            margin: 12px 0;
        }

        .peer-info {
            background: white;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 13px;
            color: #666;
        }

        .peer-info strong {
            color: #667eea;
            font-family: 'Courier New', monospace;
        }

        /* Audio Indicator */
        .audio-indicator {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
        }

        .audio-indicator-text {
            font-size: 12px;
            color: #2e7d32;
            font-weight: 600;
        }

        .sound-bars {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 24px;
        }

        .sound-bar {
            width: 4px;
            background: #667eea;
            border-radius: 2px;
            animation: pulse 0.4s ease-in-out infinite;
        }

        .sound-bar:nth-child(1) {
            animation-delay: 0s;
            height: 8px;
        }

        .sound-bar:nth-child(2) {
            animation-delay: 0.1s;
            height: 14px;
        }

        .sound-bar:nth-child(3) {
            animation-delay: 0.2s;
            height: 20px;
        }

        @keyframes pulse {
            0%, 100% {
                height: 8px;
            }
            50% {
                height: 20px;
            }
        }

        .error-message {
            display: none;
            padding: 12px;
            background: #ffebee;
            color: #c62828;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 13px;
        }

        .info-box {
            background: #f5f5f5;
            padding: 1rem;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
            margin-top: 1rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <!-- Status Badge -->
        <div class="status-badge">✓ Ready to call</div>

        <!-- Error Message -->
        <div class="error-message" id="errorMessage"></div>

        <!-- Your Unique Number Display -->
        <div class="your-number">
            <div class="your-number-label">Your Call Number</div>
            <div class="your-number-display" id="yourNumber">---</div>
        </div>

        <!-- Dial Section -->
        <div class="dial-section">
            <div class="dial-label">Enter the 3-digit number you want to call</div>
            
            <!-- Dial Input Field -->
            <input 
                type="text" 
                class="dial-input" 
                id="dialInput" 
                placeholder="000" 
                maxlength="3" 
                inputmode="numeric"
                readonly
            >

            <!-- Numeric Keypad (0-9, *, #) -->
            <div class="dial-buttons">
                <button class="dial-btn" onclick="addDigit('1')">1</button>
                <button class="dial-btn" onclick="addDigit('2')">2</button>
                <button class="dial-btn" onclick="addDigit('3')">3</button>
                <button class="dial-btn" onclick="addDigit('4')">4</button>
                <button class="dial-btn" onclick="addDigit('5')">5</button>
                <button class="dial-btn" onclick="addDigit('6')">6</button>
                <button class="dial-btn" onclick="addDigit('7')">7</button>
                <button class="dial-btn" onclick="addDigit('8')">8</button>
                <button class="dial-btn" onclick="addDigit('9')">9</button>
                <button class="dial-btn" onclick="addDigit('*')">*</button>
                <button class="dial-btn" onclick="addDigit('0')">0</button>
                <button class="dial-btn" onclick="addDigit('#')">#</button>
                <button class="dial-btn delete" onclick="deleteDigit()">⌫ Delete</button>
            </div>

            <!-- Call and Hangup Buttons -->
            <div class="call-buttons">
                <button class="call-btn primary" id="callBtn" onclick="startCall()">
                    📞 Call
                </button>
                <button class="call-btn primary secondary" id="hangupBtn" onclick="hangupCall()" style="display: none;">
                    ❌ Hang Up
                </button>
            </div>
        </div>

        <!-- Call Status Display -->
        <div class="call-status" id="callStatus">
            <div class="call-status-text" id="callStatusText">Calling...</div>
            <div class="timer" id="callTimer" style="display: none;">00:00</div>
            <div class="peer-info" id="peerInfo" style="display: none;">
                Connected to: <strong id="connectedNumber">---</strong>
            </div>
            <div class="audio-indicator" id="audioIndicator">
                <span class="audio-indicator-text">Audio Active:</span>
                <div class="sound-bars">
                    <div class="sound-bar"></div>
                    <div class="sound-bar"></div>
                    <div class="sound-bar"></div>
                </div>
            </div>
        </div>

        <!-- Info Box -->
        <div class="info-box">
            <strong>How it works:</strong><br>
            1. Your number is shown above<br>
            2. Enter anyone's 3-digit number<br>
            3. Press Call to connect<br>
            4. Grant microphone permission<br>
            5. Start talking!
        </div>
    </div>
</div>

<script>
    // ========== GLOBAL VARIABLES ==========
    let myNumber = '';           // User's unique 3-digit number
    let localStream = null;      // User's microphone stream
    let callInProgress = false;  // Track if call is active
    let callStartTime = null;    // When the call started
    let timerInterval = null;    // Timer interval reference
    let dialedNumber = '';       // Number being dialed

    // ========== INITIALIZATION ==========
    /**
     * Initialize the app
     * - Generate unique 3-digit number (000-999)
     * - Display it to the user
     */
    function initialize() {
        myNumber = String(Math.floor(Math.random() * 1000)).padStart(3, '0');
        document.getElementById('yourNumber').textContent = myNumber;
        console.log('Your number:', myNumber);
    }

    // ========== DIAL PAD FUNCTIONS ==========
    /**
     * Add a digit to the dial input
     * @param {string} digit - The digit to add (0-9, *, #)
     */
    function addDigit(digit) {
        if (dialedNumber.length < 3) {
            dialedNumber += digit;
            document.getElementById('dialInput').value = dialedNumber;
        }
    }

    /**
     * Delete the last digit from the dial input
     */
    function deleteDigit() {
        dialedNumber = dialedNumber.slice(0, -1);
        document.getElementById('dialInput').value = dialedNumber;
    }

    /**
     * Clear error message
     */
    function clearError() {
        document.getElementById('errorMessage').style.display = 'none';
        document.getElementById('errorMessage').textContent = '';
    }

    /**
     * Show error message to user
     * @param {string} message - Error message to display
     */
    function showError(message) {
        document.getElementById('errorMessage').style.display = 'block';
        document.getElementById('errorMessage').textContent = message;
        setTimeout(clearError, 5000); // Auto-hide after 5 seconds
    }

    // ========== CALL FUNCTIONS ==========
    /**
     * Start a call to the dialed number
     * - Request microphone permission
     * - Initialize peer connection (would connect to actual peer)
     * - Update UI to show call in progress
     */
    async function startCall() {
        const targetNumber = dialedNumber.trim();
        clearError();

        // Validation: Must be 3 digits
        if (targetNumber.length !== 3) {
            showError('Please enter a valid 3-digit number');
            return;
        }

        // Validation: Cannot call yourself
        if (targetNumber === myNumber) {
            showError('You cannot call your own number!');
            return;
        }

        // Validation: Number must contain only digits
        if (!/^\d+$/.test(targetNumber)) {
            showError('Number must contain only digits (0-9)');
            return;
        }

        try {
            // Request microphone access from browser
            console.log('Requesting microphone access...');
            localStream = await navigator.mediaDevices.getUserMedia({ 
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                } 
            });
            console.log('Microphone access granted');

            // Update UI state
            callInProgress = true;
            callStartTime = Date.now();

            document.getElementById('callStatus').style.display = 'block';
            document.getElementById('callStatusText').textContent = `📞 Calling ${targetNumber}...`;
            document.getElementById('connectedNumber').textContent = targetNumber;
            document.getElementById('peerInfo').style.display = 'block';
            document.getElementById('audioIndicator').style.display = 'flex';
            document.getElementById('callBtn').style.display = 'none';
            document.getElementById('hangupBtn').style.display = 'block';
            document.getElementById('dialInput').disabled = true;

            // Start timer
            startTimer();

            // Simulate connection delay (in real app, this waits for actual peer connection)
            console.log('Establishing peer connection...');
            setTimeout(() => {
                if (callInProgress) {
                    document.getElementById('callStatusText').textContent = 
                        `✓ Connected to ${targetNumber}`;
                    console.log('Call connected');
                }
            }, 2000);

        } catch (error) {
            console.error('Microphone error:', error);
            
            // Handle different error types
            if (error.name === 'NotAllowedError') {
                showError('Microphone permission denied. Please allow access to continue.');
            } else if (error.name === 'NotFoundError') {
                showError('No microphone found on your device.');
            } else {
                showError('Microphone error: ' + error.message);
            }
        }
    }

    /**
     * End the current call
     * - Stop microphone stream
     * - Close peer connection
     * - Reset UI to initial state
     */
    function hangupCall() {
        console.log('Ending call...');
        callInProgress = false;

        // Stop all audio tracks
        if (localStream) {
            localStream.getTracks().forEach(track => {
                track.stop();
                console.log('Stopped audio track');
            });
            localStream = null;
        }

        // Stop timer
        if (timerInterval) {
            clearInterval(timerInterval);
        }

        // Reset UI
        document.getElementById('callStatus').style.display = 'none';
        document.getElementById('callTimer').style.display = 'none';
        document.getElementById('callBtn').style.display = 'block';
        document.getElementById('hangupBtn').style.display = 'none';
        document.getElementById('dialInput').disabled = false;

        // Clear dialed number
        dialedNumber = '';
        document.getElementById('dialInput').value = '';

        console.log('Call ended');
    }

    // ========== TIMER FUNCTION ==========
    /**
     * Start and update call timer
     * - Shows minutes:seconds format
     * - Updates every second
     */
    function startTimer() {
        document.getElementById('callTimer').style.display = 'block';

        // Clear any existing timer
        if (timerInterval) {
            clearInterval(timerInterval);
        }

        // Update timer every second
        timerInterval = setInterval(() => {
            if (!callInProgress) return;

            // Calculate elapsed time
            const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;

            // Format as MM:SS
            const formattedTime = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            document.getElementById('callTimer').textContent = formattedTime;
        }, 1000);
    }

    // ========== START APP ==========
    // Initialize when page loads
    window.addEventListener('load', initialize);

    // Handle page unload - clean up if user closes tab during call
    window.addEventListener('beforeunload', () => {
        if (callInProgress) {
            hangupCall();
        }
    });
</script>

</body>
</html>
