<!DOCTYPE html>
<html>
<head>
>    <title>XMovies</title
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0f172a;
            color: white;
        }

        header {
            background: #020617;
            padding: 15px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        input {
            width: 90%;
            max-width: 400px;
            padding: 10px;
            margin: 20px auto;
            display: block;
            border-radius: 8px;
            border: none;
        }

        .movies {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding: 15px;
        }

        .movie {
            background: #1e293b;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }

        .movie img {
            width: 100%;
            border-radius: 8px;
        }

        button {
            background: #22c55e;
            border: none;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Video Player */
        #playerBox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
        }

        video {
            width: 90%;
            max-width: 700px;
        }

        .closeBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 25px;
            cursor: pointer;
        }

        textarea {
            width: 90%;
            max-width: 400px;
            margin: 10px auto;
            display: block;
            padding: 10px;
            border-radius: 8px;
        }

        .comments {
            max-width: 400px;
            margin: auto;
        }

        .comment {
            background: #1e293b;
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<header>XMovies</header>

<input type="text" id="search" placeholder="Search Movies..." onkeyup="searchMovie()">

<div class="movies" id="movies">

    <div class="movie">
        <img src="https://cdn.moviefone.com/image-assets/564147/ltHlJwvxKv7d0ooCiKSAvfwV9tX.jpg?d=360x540&q=80">
        <h3>KGF Chapter 1</h3>
        <button onclick="playMovie('https://muc001.myturn1.top:8088/live/webcrict10/playlist.m3u8?id=113947&pk=a40d5256b3a19bef9a24eb4977b9f4454a48951b017b29131b6303b3140ba6b843d3a10420d7b77cc5b1e35e531a5bf476ca4ff44aad04f0e5c4ecef08234e89')">▶ Play</button>
    </div>

    <div class="movie">
        <img src="https://via.placeholder.com/150">
        <h3>Pushpa</h3>
        <button onclick="playMovie('pushpa.mp4')">▶ Play</button>
    </div>

    <div class="movie">
        <img src="https://via.placeholder.com/150">
        <h3>RRR</h3>
        <button onclick="playMovie('rrr.mp4')">▶ Play</button>
    </div>

</div>

<!-- VIDEO PLAYER -->
<div id="playerBox">
    <span class="closeBtn" onclick="closePlayer()">✖</span>
    <video id="videoPlayer" controls></video>
</div>

<!-- COMMENT -->
<textarea id="commentInput" placeholder="Write feedback..."></textarea>
<button onclick="addComment()">Submit</button>

<div class="comments" id="comments"></div>

<script>
// SEARCH
function searchMovie() {
    let input = document.getElementById("search").value.toLowerCase();
    let movies = document.getElementsByClassName("movie");

    for (let i = 0; i < movies.length; i++) {
        let text = movies[i].innerText.toLowerCase();
        movies[i].style.display = text.includes(input) ? "block" : "none";
    }
}

// VIDEO PLAY
function playMovie(file) {
    let player = document.getElementById("videoPlayer");
    player.src = file;
    document.getElementById("playerBox").style.display = "flex";
    player.play();
}

// CLOSE PLAYER
function closePlayer() {
    let player = document.getElementById("videoPlayer");
    player.pause();
    player.src = "";
    document.getElementById("playerBox").style.display = "none";
}

// COMMENT SYSTEM
function addComment() {
    let input = document.getElementById("commentInput");
    let comment = input.value;

    if (comment === "") return;

    let comments = JSON.parse(localStorage.getItem("comments") || "[]");
    comments.push(comment);
    localStorage.setItem("comments", JSON.stringify(comments));

    input.value = "";
    showComments();
}

function showComments() {
    let comments = JSON.parse(localStorage.getItem("comments") || "[]");
    let box = document.getElementById("comments");
    box.innerHTML = "";

    comments.forEach(c => {
        let div = document.createElement("div");
        div.className = "comment";
        div.innerText = c;
        box.appendChild(div);
    });
}

showComments();
</script>

</body>
</html>
