<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TelePost — WhatsApp Style</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111B21;--sidebar:#202C33;--chat:#0B141A;--bubble-out:#005C4B;
  --bubble-in:#202C33;--green:#25D366;--green2:#128C7E;--teal:#00A884;
  --text:#E9EDEF;--muted:#8696A0;--border:#2A3942;--r:8px;
  --font:'Inter',sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font);display:flex;flex-direction:column}

/* ── TOPBAR ── */
.topbar{height:60px;background:var(--sidebar);display:flex;align-items:center;padding:0 20px;gap:14px;flex-shrink:0;border-bottom:1px solid var(--border)}
.tp-avatar{width:40px;height:40px;border-radius:50%;background:var(--green2);display:grid;place-items:center;font-size:1rem}
.tp-info h2{font-size:.92rem;font-weight:600}
.tp-info p{font-size:.72rem;color:var(--muted)}
.tp-actions{margin-left:auto;display:flex;gap:18px}
.tp-actions svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;cursor:pointer}
.tp-actions svg:hover{stroke:var(--text)}

/* ── LAYOUT ── */
.layout{display:flex;flex:1;min-height:0;overflow:hidden}

/* ── SIDEBAR (Inbox) ── */
.sidebar{width:380px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sb-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-head h3{font-size:.82rem;font-weight:600;color:var(--text)}
.refresh-btn{margin-left:auto;background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:5px;color:var(--muted);font-size:.72rem;padding:5px 8px;border-radius:6px;transition:.2s}
.refresh-btn:hover{background:rgba(255,255,255,.06);color:var(--text)}
.refresh-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.countdown{font-size:.65rem;color:var(--muted);font-family:monospace}
#msg-list{flex:1;overflow-y:auto;padding:8px 0}
#msg-list::-webkit-scrollbar{width:4px}
#msg-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.msg-row{display:flex;align-items:flex-start;gap:12px;padding:10px 16px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.03);transition:background .15s}
.msg-row:hover{background:rgba(255,255,255,.04)}
.msg-av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--green2),#128C7E);display:grid;place-items:center;font-size:1rem;font-weight:600;flex-shrink:0;color:#fff}
.msg-info{flex:1;min-width:0}
.msg-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.msg-name{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-time2{font-size:.65rem;color:var(--muted);flex-shrink:0}
.msg-preview{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.msg-badge{background:var(--green);color:#111;font-size:.6rem;font-weight:700;padding:2px 6px;border-radius:10px;flex-shrink:0}
.empty-inbox{padding:48px 20px;text-align:center;color:var(--muted);font-size:.82rem;line-height:1.7}
.empty-inbox svg{width:40px;height:40px;stroke:var(--muted);fill:none;stroke-width:1.3;stroke-linecap:round;margin:0 auto 12px;display:block}

/* ── CHAT AREA ── */
.chat-area{flex:1;display:flex;flex-direction:column;background:var(--chat);position:relative;min-width:0}
.chat-bg{position:absolute;inset:0;opacity:.04;background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
.chat-messages{flex:1;overflow-y:auto;padding:16px 8%;position:relative;z-index:1}
.chat-messages::-webkit-scrollbar{width:4px}
.chat-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* bubbles */
.bubble-wrap{display:flex;margin-bottom:4px}
.bubble-wrap.out{justify-content:flex-end}
.bubble-wrap.in{justify-content:flex-start}
.bubble{max-width:65%;padding:7px 12px 8px;border-radius:8px;position:relative;font-size:.85rem;line-height:1.5;word-break:break-word}
.bubble-wrap.out .bubble{background:var(--bubble-out);border-top-right-radius:2px}
.bubble-wrap.in .bubble{background:var(--bubble-in);border-top-left-radius:2px}
.bubble .bub-meta{display:flex;align-items:center;gap:6px;margin-top:3px}
.bubble .bub-time{font-size:.63rem;color:rgba(255,255,255,.45)}
.bubble .bub-name{font-size:.7rem;color:var(--teal);font-weight:600;margin-bottom:2px}
.bubble .bub-type{font-size:.65rem;background:rgba(255,255,255,.1);padding:1px 5px;border-radius:4px;color:rgba(255,255,255,.6)}
.tick{width:14px;height:14px;fill:var(--teal)}
.date-sep{text-align:center;margin:12px 0}
.date-sep span{background:rgba(17,27,33,.85);color:var(--muted);font-size:.7rem;padding:4px 12px;border-radius:8px;border:1px solid var(--border)}

/* ── INPUT BAR ── */
.input-bar{background:var(--sidebar);padding:10px 16px;display:flex;align-items:flex-end;gap:10px;border-top:1px solid var(--border);position:relative;z-index:2;flex-shrink:0}
.attach-btn{width:40px;height:40px;border-radius:50%;background:none;border:none;cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:.2s}
.attach-btn:hover{background:rgba(255,255,255,.06)}
.attach-btn svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.attach-panel{position:absolute;bottom:68px;left:16px;background:var(--sidebar);border:1px solid var(--border);border-radius:12px;padding:12px;display:none;gap:10px;flex-wrap:wrap;width:200px;z-index:10}
.attach-panel.open{display:flex}
.attach-opt{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:8px;border-radius:8px;transition:.15s;width:72px}
.attach-opt:hover{background:rgba(255,255,255,.06)}
.attach-opt .aicon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.attach-opt span{font-size:.65rem;color:var(--muted);text-align:center}
.aicon svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* preview chips */
#img-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;display:none}
.img-chip{position:relative;width:52px;height:52px;border-radius:8px;overflow:hidden;border:2px solid var(--green2);flex-shrink:0}
.img-chip img{width:100%;height:100%;object-fit:cover}
.img-chip .rm2{position:absolute;top:1px;right:1px;background:rgba(0,0,0,.8);border:none;border-radius:50%;width:16px;height:16px;color:#fff;font-size:8px;cursor:pointer;display:grid;place-items:center}

.msg-input-wrap{flex:1;background:var(--bg);border-radius:22px;display:flex;flex-direction:column;padding:8px 14px;border:1px solid var(--border);min-height:44px}
#caption{background:none;border:none;color:var(--text);font-family:var(--font);font-size:.88rem;outline:none;resize:none;max-height:120px;line-height:1.5;width:100%}
#caption::placeholder{color:var(--muted)}
.send-btn{width:44px;height:44px;border-radius:50%;background:var(--teal);border:none;cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:.15s}
.send-btn:hover{background:var(--green2)}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.send-btn svg{width:20px;height:20px;fill:#fff;margin-left:2px}

/* hidden file input */
#file-input{display:none}

/* scrollbar */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

@media(max-width:700px){
  .sidebar{width:100%;position:absolute;z-index:50;height:100%;transform:translateX(-100%);transition:.3s}
  .sidebar.open{transform:translateX(0)}
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="tp-avatar">🤖</div>
  <div class="tp-info">
    <h2>My Telegram Bot</h2>
    <p id="bot-status">Connecting…</p>
  </div>
  <div class="tp-actions">
    <svg viewBox="0 0 24 24" title="Search" onclick="alert('Search coming soon')"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <svg viewBox="0 0 24 24" title="More"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
  </div>
</div>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR: Inbox -->
  <div class="sidebar" id="sidebar">
    <div class="sb-head">
      <h3>📥 Inbox</h3>
      <button class="refresh-btn" id="refresh-btn">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Refresh
      </button>
      <span class="countdown" id="countdown">15s</span>
    </div>
    <div id="msg-list">
      <div class="empty-inbox">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Loading messages…
      </div>
    </div>
  </div>

  <!-- CHAT AREA -->
  <div class="chat-area">
    <div class="chat-bg"></div>
    <div class="chat-messages" id="chat-messages">
      <!-- messages rendered here -->
    </div>

    <!-- attach panel -->
    <div class="attach-panel" id="attach-panel">
      <div class="attach-opt" onclick="document.getElementById('file-input').click()">
        <div class="aicon" style="background:#BF59CF">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </div>
        <span>Photos</span>
      </div>
    </div>

    <!-- INPUT BAR -->
    <div class="input-bar">
      <button class="attach-btn" id="attach-toggle">
        <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <input type="file" id="file-input" accept="image/*" multiple/>
      <div class="msg-input-wrap">
        <div id="img-chips"></div>
        <textarea id="caption" rows="1" placeholder="Message" oninput="autoResize(this)"></textarea>
      </div>
      <button class="send-btn" id="send-btn">
        <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
// ── DECRYPT ──────────────────────────────────────────────────────
const _k=[116,112,107,57,120,81,109,50,90,114,55,110,76,115,89,118,66,119,69,100];
const _t=[76,72,92,0,75,101,93,6,105,75,13,47,13,53,47,21,56,37,125,9,17,64,91,72,14,6,29,94,24,49,79,4,19,25,31,7,4,26,119,93,24,24,31,124,40,58];
const _c=[66,64,88,13,64,101,92,11,104,69];
const xd=a=>a.map((b,i)=>String.fromCharCode(b^_k[i%_k.length])).join('');
const TOKEN=xd(_t), CHAT=xd(_c);
const BASE=`https://api.telegram.org/bot${TOKEN}`;

// ── AUTO RESIZE TEXTAREA ────────────────────────────────────────
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px'}

// ── FILES ───────────────────────────────────────────────────────
let files=[];
const fi=document.getElementById('file-input');
const chips=document.getElementById('img-chips');

fi.addEventListener('change',()=>{
  [...fi.files].forEach(f=>{
    if(!f.type.startsWith('image/')){showNotif('❌ Not an image: '+f.name);return}
    if(f.size>10*1024*1024){showNotif('❌ Too large: '+f.name);return}
    if(files.find(x=>x.name===f.name&&x.size===f.size))return;
    files.push(f);
  });
  fi.value='';
  renderChips();
});

function renderChips(){
  chips.innerHTML='';
  chips.style.display=files.length?'flex':'none';
  files.forEach((f,i)=>{
    const url=URL.createObjectURL(f);
    const c=document.createElement('div');
    c.className='img-chip';
    c.innerHTML=`<img src="${url}"/><button class="rm2" data-i="${i}">✕</button>`;
    chips.appendChild(c);
  });
  chips.querySelectorAll('.rm2').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();files.splice(+b.dataset.i,1);renderChips();
  }));
}

// ── ATTACH PANEL ────────────────────────────────────────────────
const ap=document.getElementById('attach-panel');
document.getElementById('attach-toggle').addEventListener('click',e=>{
  e.stopPropagation();ap.classList.toggle('open');
});
document.addEventListener('click',()=>ap.classList.remove('open'));

// ── SEND ─────────────────────────────────────────────────────────
const sendBtn=document.getElementById('send-btn');
const capEl=document.getElementById('caption');

sendBtn.addEventListener('click',sendMsg);
capEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}
});

async function sendMsg(){
  const text=capEl.value.trim();
  if(!text&&files.length===0) return;

  sendBtn.disabled=true;

  // show outgoing bubble immediately
  const previewText=text||(files.length===1?'📷 Photo':`📷 ${files.length} Photos`);
  addBubble({dir:'out',text:previewText,time:Date.now()/1000,sending:true});

  try{
    if(files.length===1){
      const fd=new FormData();
      fd.append('chat_id',CHAT);
      fd.append('photo',files[0]);
      if(text)fd.append('caption',text);
      const r=await fetch(`${BASE}/sendPhoto`,{method:'POST',body:fd});
      const j=await r.json();
      if(!j.ok){showNotif('❌ '+j.description);removeSendingBubble();return}
    }else if(files.length>1){
      const media=[];const fd=new FormData();
      files.forEach((f,i)=>{const k=`p${i}`;fd.append(k,f,f.name);const m={type:'photo',media:`attach://${k}`};if(i===0&&text)m.caption=text;media.push(m)});
      fd.append('chat_id',CHAT);fd.append('media',JSON.stringify(media));
      const r=await fetch(`${BASE}/sendMediaGroup`,{method:'POST',body:fd});
      const j=await r.json();
      if(!j.ok){showNotif('❌ '+j.description);removeSendingBubble();return}
    }else{
      const r=await fetch(`${BASE}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:CHAT,text})});
      const j=await r.json();
      if(!j.ok){showNotif('❌ '+j.description);removeSendingBubble();return}
    }
    // mark sent
    markSent();
    capEl.value='';capEl.style.height='auto';
    files=[];renderChips();
    setTimeout(fetchInbox,1200);
  }catch(e){showNotif('❌ Network error');removeSendingBubble();}
  finally{sendBtn.disabled=false;}
}

// ── CHAT BUBBLES ─────────────────────────────────────────────────
const chatEl=document.getElementById('chat-messages');
let lastDate='';

function fmtTime(unix){
  return new Date(unix*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}
function fmtDate(unix){
  const d=new Date(unix*1000);
  return d.toLocaleDateString([],{day:'numeric',month:'long',year:'numeric'});
}

function addBubble({dir,text,time,name,type,sending}){
  const d=fmtDate(time);
  if(d!==lastDate){
    lastDate=d;
    const sep=document.createElement('div');sep.className='date-sep';
    sep.innerHTML=`<span>${d}</span>`;chatEl.appendChild(sep);
  }
  const w=document.createElement('div');
  w.className=`bubble-wrap ${dir}`;
  if(sending)w.dataset.sending='1';
  const tick=dir==='out'?`<svg class="tick" viewBox="0 0 16 11"><path d="M11.071.653a.75.75 0 0 1 .076 1.058L5.185 9.08a.75.75 0 0 1-1.093.04L.808 5.786a.75.75 0 0 1 1.06-1.06l2.85 2.85L10.01.73a.75.75 0 0 1 1.061-.076z" fill-rule="nonzero"/></svg>`:'';
  const nameHtml=dir==='in'&&name?`<div class="bub-name">${esc(name)}</div>`:'';
  const typeHtml=type&&type!=='text'?`<span class="bub-type">${type}</span>`:'';
  w.innerHTML=`<div class="bubble">${nameHtml}${esc(text)}<div class="bub-meta"><span class="bub-time">${fmtTime(time)}</span>${typeHtml}${tick}</div></div>`;
  chatEl.appendChild(w);
  chatEl.scrollTop=chatEl.scrollHeight;
}

function removeSendingBubble(){const s=chatEl.querySelector('[data-sending]');if(s)s.remove();}
function markSent(){const s=chatEl.querySelector('[data-sending]');if(s)delete s.dataset.sending;}

// ── INBOX ─────────────────────────────────────────────────────────
let lastId=0;
const msgList=document.getElementById('msg-list');
const seenIds=new Set();

async function fetchInbox(){
  try{
    const url=lastId>0?`${BASE}/getUpdates?offset=${lastId+1}&limit=50`:`${BASE}/getUpdates?limit=50`;
    const r=await fetch(url);const j=await r.json();
    if(!j.ok){document.getElementById('bot-status').textContent='⚠️ Token error';return;}
    document.getElementById('bot-status').textContent='Online';
    const updates=j.result;
    if(!updates.length&&lastId===0){
      msgList.innerHTML=`<div class="empty-inbox"><svg viewBox="0 0 24 24" style="width:40px;height:40px;stroke:var(--muted);fill:none;stroke-width:1.3;stroke-linecap:round;display:block;margin:0 auto 12px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>No messages yet.<br/>Send a message to your bot.</div>`;
      return;
    }
    updates.forEach(u=>{
      if(u.update_id>lastId)lastId=u.update_id;
      const msg=u.message||u.channel_post||u.edited_message;
      if(!msg||seenIds.has(msg.message_id))return;
      seenIds.add(msg.message_id);
      renderInboxRow(msg);
      // add to chat as incoming bubble
      const from=msg.from||msg.sender_chat||{};
      const name=from.first_name?`${from.first_name}${from.last_name?' '+from.last_name:''}`:(from.title||'User');
      let text=msg.text||msg.caption||'';
      let type='text';
      if(msg.photo){type='photo';if(!text)text='📷 Photo'}
      else if(msg.video){type='video';if(!text)text='🎬 Video'}
      else if(msg.document){type='file';if(!text)text=`📎 ${msg.document.file_name||'File'}`}
      else if(msg.voice){type='voice';if(!text)text=`🎤 Voice (${msg.voice.duration}s)`}
      else if(msg.sticker){type='sticker';if(!text)text=`${msg.sticker.emoji||'🎭'} Sticker`}
      else if(msg.location){type='location';if(!text)text=`📍 ${msg.location.latitude}, ${msg.location.longitude}`}
      if(!text)text='[Unsupported message]';
      addBubble({dir:'in',text,time:msg.date,name,type});
    });
  }catch(e){console.warn(e)}
}

function renderInboxRow(msg){
  if(msgList.querySelector('.empty-inbox'))msgList.innerHTML='';
  const from=msg.from||msg.sender_chat||{};
  const name=from.first_name?`${from.first_name}${from.last_name?' '+from.last_name:''}`:(from.title||'User');
  const init=(name.charAt(0)||'?').toUpperCase();
  let preview=msg.text||msg.caption||'';
  if(msg.photo&&!preview)preview='📷 Photo';
  if(msg.video&&!preview)preview='🎬 Video';
  if(msg.document&&!preview)preview=`📎 ${msg.document.file_name||'File'}`;
  if(msg.voice&&!preview)preview='🎤 Voice';
  if(msg.sticker&&!preview)preview=`${msg.sticker.emoji||'🎭'} Sticker`;
  if(!preview)preview='Message';
  const time=new Date(msg.date*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const row=document.createElement('div');
  row.className='msg-row';
  row.innerHTML=`
    <div class="msg-av">${init}</div>
    <div class="msg-info">
      <div class="msg-top"><span class="msg-name">${esc(name)}</span><span class="msg-time2">${time}</span></div>
      <div class="msg-preview">${esc(preview.substring(0,60))}</div>
    </div>`;
  msgList.prepend(row);
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function showNotif(msg){
  const n=document.createElement('div');
  n.style.cssText='position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#1E2D3A;border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:8px;font-size:.82rem;z-index:999;animation:fin .2s ease';
  n.textCon
