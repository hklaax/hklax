<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>My Shop</title>
<style>
:root{--blue:#2563eb;--yel:#fde68a;--green:#16a34a;--bg:#f4f6fb;--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb;--red:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button{font-family:inherit;cursor:pointer}
/* header */
header{position:sticky;top:0;z-index:20;background:var(--blue);box-shadow:0 2px 4px rgba(0,0,0,.2)}
.top{max-width:1200px;margin:auto;padding:10px 14px;display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.logo{color:#fff;font-weight:700;font-size:21px;font-style:italic;white-space:nowrap}
.logo small{display:block;font-size:10px;font-weight:400;color:#fff;opacity:.9}
.logo small b{color:var(--yel)}
.search{flex:1;min-width:0;display:flex;background:#fff;border-radius:4px;overflow:hidden}
.search input{flex:1;border:0;padding:10px 14px;font-size:15px;outline:none;min-width:0}
.search span{padding:0 14px;display:flex;align-items:center;color:var(--blue);font-size:18px}
.abtn{background:#fff;color:var(--blue);border:0;padding:9px 16px;font-weight:600;border-radius:2px;font-size:14px}
/* categories */
.cats{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.cats div{max-width:1200px;margin:auto;display:flex;gap:6px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
.cats div::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:none;padding:8px 14px;font-size:14px;font-weight:500;color:var(--ink);border-bottom:3px solid transparent}
.chip.on{color:var(--blue);border-bottom-color:var(--blue)}
/* banner */
.banner{max-width:1200px;margin:10px auto 0;padding:0 14px}
.banner div{background:linear-gradient(100deg,#2874f0,#6a5af9);color:#fff;border-radius:4px;padding:22px 20px}
.banner h1{font-size:clamp(20px,4vw,30px)}
.banner p{opacity:.9;font-size:14px;margin-top:4px}
/* sort */
.sort{max-width:1200px;margin:10px auto 0;padding:0 14px}
.sort div{background:#fff;padding:10px 14px;display:flex;align-items:center;gap:6px;overflow-x:auto;border-radius:2px;scrollbar-width:none}
.sort b{font-size:14px;margin-right:6px;flex:none}
.sort button{flex:none;border:0;background:none;font-size:14px;padding:6px 10px;color:var(--ink);border-bottom:2px solid transparent}
.sort button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.count{max-width:1200px;margin:auto;padding:8px 16px 0;font-size:13px;color:var(--mute)}
/* grid */
.grid{max-width:1200px;margin:auto;padding:8px 14px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.card{background:#fff;border-radius:2px;position:relative;cursor:pointer;display:flex;flex-direction:column;transition:box-shadow .2s}
.card:hover{box-shadow:0 3px 14px rgba(0,0,0,.18)}
.card .im{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:12px;position:relative}
.card img{max-width:100%;max-height:100%;object-fit:contain}
.card .bd{padding:6px 12px 14px}
.nm{font-size:14px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.ct{font-size:12px;color:var(--mute);margin-bottom:2px}
.pr{margin-top:6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pr b{font-size:17px}
.pr s{font-size:13px;color:var(--mute)}
.pr em{font-style:normal;font-size:13px;font-weight:600;color:var(--green)}
.oos{position:absolute;inset:0;background:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--red);font-size:14px}
.new{position:absolute;top:8px;left:8px;background:var(--green);color:#fff;font-size:11px;padding:2px 7px;border-radius:2px;font-weight:600}
.empty{grid-column:1/-1;background:#fff;text-align:center;padding:60px 16px;color:var(--mute)}
footer{background:#172337;color:#c2c2c2;padding:22px 16px;text-align:center;font-size:13px;line-height:1.7}
footer a{color:var(--yel);text-decoration:none}
/* modals */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:50}
.modal.on{display:flex}
.box{background:#fff;border-radius:4px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:20px;position:relative}
.box.sm{max-width:380px}
.x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:26px;color:var(--mute)}
.det{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:620px){.det{grid-template-columns:1fr}}
.det img{width:100%;max-height:380px;object-fit:contain}
.det h2{font-size:20px;font-weight:500;margin:4px 0 8px}
.det .pr b{font-size:26px}
.det p{font-size:14px;color:#444;margin-top:14px;line-height:1.55;white-space:pre-wrap}
.stk{display:inline-block;margin-top:10px;font-size:13px;font-weight:600}
.act{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{border:0;padding:12px 18px;border-radius:2px;font-size:14px;font-weight:600;color:#fff;background:var(--blue);text-decoration:none;display:inline-block;text-align:center}
.btn.wa{background:#25d366}
.btn.or{background:#fb641b}
.btn.gh{background:#fff;color:var(--blue);border:1px solid var(--line)}
.btn.full{width:100%;margin-top:12px}
.btn:disabled{opacity:.5}
/* admin */
#admin{display:none;max-width:1000px;margin:14px auto;padding:0 14px 50px}
.panel{background:#fff;padding:18px;border-radius:2px;margin-bottom:12px}
.panel h2{font-size:17px;margin-bottom:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:2px;font-size:14px;font-family:inherit}
textarea{min-height:70px;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.chk input{width:auto}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.th{position:relative;width:72px;height:72px;border:1px solid var(--line);border-radius:3px}
.th img{width:100%;height:100%;object-fit:cover;border-radius:3px;cursor:pointer}
.th button{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:15px;line-height:22px;padding:0}
.th em{position:absolute;bottom:0;left:0;right:0;background:rgba(40,116,240,.92);color:#fff;font-size:10px;text-align:center;font-style:normal;border-radius:0 0 3px 3px}
.th:not(:first-child) em{display:none}
.pinfo{font-size:12px;color:var(--mute);margin-top:6px}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li img{width:52px;height:52px;object-fit:contain;border:1px solid var(--line)}
.li .t{flex:1;font-size:14px;min-width:0}
.li .t small{display:block;color:var(--mute)}
.mini{border:1px solid var(--line);background:#fff;padding:6px 10px;font-size:12px;border-radius:2px}
.mini.del{color:var(--red)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 18px;border-radius:2px;font-size:14px;display:none;z-index:99}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
.card img{opacity:0;transition:opacity .35s}
.card img.ld{opacity:1}
.card:active{transform:scale(.99)}
.sk{background:#fff;padding:12px}
.sk i{display:block;border-radius:3px;background:linear-gradient(90deg,#eee 25%,#f7f7f7 37%,#eee 63%);background-size:400% 100%;animation:sh 1.3s infinite}
.sk i:nth-child(1){aspect-ratio:1/1}
.sk i:nth-child(2){height:12px;margin-top:10px;width:85%}
.sk i:nth-child(3){height:14px;margin-top:8px;width:45%}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.modal.on .box{animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.cnt{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 7px;border-radius:10px}
.gth{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.gth img{width:56px;height:56px;max-height:none;flex:none;object-fit:cover;border:2px solid transparent;border-radius:3px;cursor:pointer}
.gth img.on{border-color:var(--blue)}
.empty b{display:block;color:var(--ink);font-size:17px;margin:6px 0 2px}
@media(max-width:620px){
 .logo{flex:1}
 .search{order:3;flex:1 0 100%}
 .top{padding:8px 12px}
 .banner{margin-top:8px;padding:0 8px}.banner div{padding:16px}
 .sort{padding:0 8px}.grid{padding:6px 8px 30px;gap:6px}
 .card .bd{padding:4px 10px 12px}
 .modal{align-items:flex-end;padding:0}
 .box,.box.sm{max-width:none;border-radius:14px 14px 0 0}
}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:fl .4s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
#camThumbs{display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto;justify-content:center}
#camThumbs img{width:48px;height:48px;object-fit:cover;border-radius:4px;border:2px solid #fff;flex:none}
.card{border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.14)}
.card .im{background:#fafafa}
.pr b{font-size:18px}
.cats div{gap:8px}
.chip{border:1px solid var(--line);border-radius:20px;background:#fff;padding:7px 15px;font-size:13px}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.sort div{border-radius:8px}
.abtn{border-radius:20px}
.btn{border-radius:8px}
.panel{border-radius:12px}
.banner div{position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(120deg,#2874f0 0%,#5b5bf0 60%,#8e54e9 100%);padding:24px 22px}
.banner div::after{content:"";position:absolute;right:-30px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.13)}
.banner .stats{display:flex;gap:8px;margin-top:12px;opacity:1;flex-wrap:wrap}
.stats span{background:rgba(255,255,255,.2);padding:4px 11px;border-radius:14px;font-size:12px}
.fav{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:0;background:#fff;color:#aaa;font-size:17px;line-height:32px;padding:0;box-shadow:0 1px 5px rgba(0,0,0,.25);z-index:2}
.fav.on{color:#e91e63}
#up{position:fixed;right:14px;bottom:18px;width:42px;height:42px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:20px;box-shadow:0 3px 10px rgba(0,0,0,.3);display:none;z-index:30}
#up.on{display:block}
.stg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stg div{background:#f1f6ff;border-radius:8px;padding:10px 4px;text-align:center}
.stg b{display:block;font-size:20px;color:var(--blue)}
.stg span{font-size:11px;color:var(--mute)}
@media(max-width:420px){.stg{grid-template-columns:repeat(2,1fr)}}
/* ===== smooth colour theme ===== */
header{background:linear-gradient(120deg,#2563eb,#4f46e5);box-shadow:0 2px 14px rgba(37,99,235,.28)}
.abtn{background:rgba(255,255,255,.96);color:#2563eb;transition:all .2s}
.abtn:hover{background:#fff;transform:translateY(-1px)}
.search{box-shadow:0 1px 4px rgba(0,0,0,.14)}
.cats{box-shadow:0 1px 0 var(--line)}
.chip{transition:all .2s}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on,.chip.on:hover{background:linear-gradient(120deg,#2563eb,#4f46e5);border-color:transparent;color:#fff}
.banner div{background:linear-gradient(120deg,#2563eb 0%,#4f46e5 55%,#7c3aed 100%)}
.sort button{transition:all .2s}
.card{border:1px solid #eceff5;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card:hover{box-shadow:0 10px 26px rgba(37,99,235,.13);border-color:#dbe4ff}
.card .im{background:linear-gradient(180deg,#fafbff,#f1f4fb)}
.new{background:linear-gradient(120deg,#16a34a,#22c55e)}
.oos{background:rgba(255,255,255,.72)}
.btn{background:linear-gradient(120deg,#2563eb,#4f46e5);box-shadow:0 2px 6px rgba(37,99,235,.25);transition:all .2s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.or{background:linear-gradient(120deg,#f97316,#fb923c);box-shadow:0 2px 6px rgba(249,115,22,.3)}
.btn.wa{background:linear-gradient(120deg,#16a34a,#22c55e);box-shadow:0 2px 6px rgba(34,197,94,.3)}
.btn.gh{background:#fff;color:var(--blue);border:1px solid #dbe4ff;box-shadow:none}
footer{background:linear-gradient(160deg,#111827,#1e293b)}
.stg div{background:#eef3ff}
.th em{background:rgba(37,99,235,.92)}
.mini{transition:all .2s}
.mini:hover{background:#f3f6ff;border-color:#c7d4ff}
input,select,textarea{transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
#up{background:linear-gradient(120deg,#2563eb,#4f46e5)}
.toast{background:#1f2937}
.cartbtn{display:inline-flex;align-items:center;gap:6px}
#cartN{background:#f97316;color:#fff;font-size:11px;min-width:18px;height:18px;line-height:18px;border-radius:9px;text-align:center;padding:0 5px;display:none}
.addb{width:100%;margin-top:auto;border:1.5px solid var(--blue);background:#fff;color:var(--blue);border-radius:8px;padding:8px;font-weight:600;font-size:13px;transition:all .2s}
.addb:hover{background:var(--blue);color:#fff}
.addb:disabled{opacity:.55;border-color:var(--line);color:var(--mute);cursor:default;background:#fff}
.stp{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--blue);border-radius:8px;overflow:hidden;width:100%;margin-top:auto}
.stp button{border:0;background:#eef3ff;color:var(--blue);width:38px;height:34px;font-size:18px;font-weight:700}
.stp b{font-size:14px}
.card .bd{flex:1;display:flex;flex-direction:column}
.card .pr{margin-bottom:10px}
.cr{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.cr img{width:60px;height:60px;object-fit:contain;border:1px solid var(--line);border-radius:8px;flex:none}
.cr .t{flex:1;min-width:0;font-size:14px}
.cr .t small{display:block;color:var(--mute)}
.cr .stp{width:112px;margin-top:8px}
.ct2{text-align:right;font-weight:700;font-size:15px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.tot{display:flex;justify-content:space-between;align-items:center;padding:14px 0 2px;font-size:16px}
.tot b{font-size:22px}
.count{padding:8px 14px 0}
.act .btn{flex:1 1 140px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}}
@media(max-width:560px){.li{flex-wrap:wrap}.li .t{flex-basis:calc(100% - 70px)}}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="logo" id="logo">MyShop<small>Explore <b>Plus ✦</b></small></div>
    <div class="search"><input id="q" placeholder="Search for products..."><span>&#128269;</span></div>
    <button class="abtn cartbtn" id="cartBtn">&#128722; Cart <span id="cartN">0</span></button>
    <button class="abtn" id="adminBtn">Admin</button>
  </div>
</header>

<div id="store">
  <div class="cats"><div id="cats"></div></div>
  <div class="banner"><div><h1 id="bTitle">Welcome to our shop</h1><p>Best prices on all items. Visit us in store!</p><p class="stats" id="stats"></p></div></div>
  <div class="sort"><div>
    <b>Sort By</b>
    <button data-s="new" class="on">Newest</button>
    <button data-s="low">Price: Low to High</button>
    <button data-s="high">Price: High to Low</button>
    <button data-s="disc">Discount</button>
  </div></div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"><div class="empty">Loading...</div></div>
  <footer id="foot"></footer>
</div>

<div id="admin">
  <div class="panel">
    <h2 id="formTitle">Add New Item</h2>
    <input type="hidden" id="editId">
    <label>Item name</label><input id="fName" placeholder="e.g. Cotton Shirt">
    <div class="row">
      <div><label>Selling price</label><input id="fPrice" type="number" min="0" placeholder="499"></div>
      <div><label>MRP (optional, shows discount)</label><input id="fMrp" type="number" min="0" placeholder="999"></div>
    </div>
    <div class="row">
      <div><label>Category</label><input id="fCat" list="catList" placeholder="e.g. Clothing"><datalist id="catList"></datalist></div>
      <div><label>Product photos (up to 5, highly compressed)</label>
      <div class="act" style="margin-top:0"><button type="button" class="btn or" id="camBtn" style="flex:1">&#128247; Take Photo</button><button type="button" class="btn gh" id="galBtn" style="flex:1">Gallery</button></div>
      <input id="fImg" type="file" accept="image/*" multiple hidden><input id="fCam" type="file" accept="image/*" capture="environment" hidden></div>
    </div>
    <div class="thumbs" id="thumbs"></div><div class="pinfo" id="pinfo"></div>
    <label>Description (optional)</label><textarea id="fDesc" placeholder="Size, colour, material..."></textarea>
    <label class="chk"><input type="checkbox" id="fStock" checked> In stock</label>
    <button class="btn full" id="saveBtn">Save Item</button>
    <button class="btn gh full" id="cancelEdit" style="display:none">Cancel edit</button>
  </div>
  <div class="panel"><h2>Overview</h2><div class="stg" id="stg"></div></div>
  <div class="panel"><h2>All Items (<span id="n">0</span>)</h2><input id="aq" placeholder="Search your items..." style="margin-bottom:6px"><div id="adminList"></div></div>
  <button class="btn gh" id="logoutBtn">Logout</button>
</div>

<div class="modal" id="loginModal"><div class="box sm">
  <button class="x" id="loginClose">&times;</button>
  <h2 style="margin-bottom:6px">Admin Login</h2>
  <label>Password</label><input id="lPass" type="password" placeholder="Admin password">
  <button class="btn full" id="loginBtn">Login</button>
</div></div>

<div class="modal" id="itemModal"><div class="box">
  <button class="x" id="mClose">&times;</button>
  <div class="det" id="det"></div>
</div></div>

<div class="modal" id="camModal"><div class="box" style="padding:0;background:#000;max-width:520px">
  <div style="position:relative"><video id="cv" playsinline muted autoplay style="width:100%;max-height:60vh;background:#000;display:block"></video><div id="flash"></div></div>
  <div class="act" style="padding:12px;justify-content:center;margin:0"><button type="button" class="btn gh" id="flip">Flip</button><button type="button" class="btn or" id="shot">&#128248; Capture</button><button type="button" class="btn" id="camDone">Done</button></div>
  <div id="camThumbs"></div>
  <div id="camInfo" style="color:#fff;text-align:center;padding:0 10px 14px;font-size:13px"></div>
</div></div>

<div class="modal" id="cartModal"><div class="box">
  <button class="x" id="cartClose">&times;</button>
  <h2 style="margin-bottom:6px">Your Cart</h2>
  <div id="cartList"></div>
  <div id="cartFoot" style="display:none">
    <label>Your name (optional)</label><input id="cName" placeholder="Name">
    <div class="tot"><span>Total</span><b id="cartTot"></b></div>
    <a class="btn wa full" id="waOrder" target="_blank" style="display:none">Send order on WhatsApp</a>
    <button type="button" class="btn gh full" id="cCopy">Copy order list</button>
    <button type="button" class="btn gh full" id="cClear" style="color:var(--red)">Clear cart</button>
  </div>
</div></div>
<button id="up" aria-label="Back to top">&#8593;</button>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

const WHATSAPP      = "";                // e.g. "919876543210" (country code + number, no +). Empty = hide button
const PHONE         = "";                // shown in footer, e.g. "+91 98765 43210"
const ADDRESS       = "";                // shown in footer
/* ============================================= */

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
db.settings({experimentalAutoDetectLongPolling:true,ignoreUndefinedProperties:true});
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MAXPICS=5;
let favs=[];try{favs=JSON.parse(localStorage.getItem("favs")||"[]")}catch{}
let cart={},cartMsg="";try{cart=JSON.parse(localStorage.getItem("cart")||"{}")}catch{}
function cartItems(){return Object.keys(cart).map(id=>({i:items.find(x=>x.id===id),q:cart[id]})).filter(x=>x.i)}
function updCart(){const n=cartItems().reduce((a,x)=>a+x.q,0);$("cartN").textContent=n;$("cartN").style.display=n?"inline-block":"none"}
function setQty(id,q){
  if(q<=0)delete cart[id];else cart[id]=Math.min(q,99);
  try{localStorage.setItem("cart",JSON.stringify(cart))}catch{}
  render();if($("cartModal").classList.contains("on"))renderCart();
}
function cartAct(e){
  const t=e.target.closest("[data-q],[data-a],[data-rm]");if(!t)return false;
  e.stopPropagation();
  if(t.dataset.a){const i=items.find(x=>x.id===t.dataset.a);if(i&&i.stock!==false){setQty(i.id,(cart[i.id]||0)+1);toast("Added to cart")}}
  else if(t.dataset.rm)setQty(t.dataset.rm,0);
  else setQty(t.dataset.id,(cart[t.dataset.id]||0)+(+t.dataset.q));
  return true;
}
function cartBtn(i){
  if(i.stock===false)return '<button class="addb" disabled>Out of stock</button>';
  const q=cart[i.id];
  return q?`<div class="stp"><button data-q="-1" data-id="${i.id}">&minus;</button><b>${q}</b><button data-q="1" data-id="${i.id}">+</button></div>`:`<button class="addb" data-a="${i.id}">Add to Cart</button>`;
}
function renderCart(){
  const L=cartItems();let tot=0;
  $("cartList").innerHTML=L.length?L.map(({i,q})=>{tot+=i.price*q;return `<div class="cr"><img src="${i.image||""}" alt=""><div class="t"><b>${esc(i.name)}</b><small>${CURRENCY}${i.price} each</small><div class="stp"><button data-q="-1" data-id="${i.id}">&minus;</button><b>${q}</b><button data-q="1" data-id="${i.id}">+</button></div></div><div class="ct2">${CURRENCY}${i.price*q}<button class="mini del" data-rm="${i.id}">Remove</button></div></div>`}).join(""):'<div class="empty" style="padding:30px">Your cart is empty.<br>Add items from the shop.</div>';
  $("cartFoot").style.display=L.length?"block":"none";
  if(!L.length)return;
  $("cartTot").textContent=CURRENCY+tot;
  const nm=$("cName").value.trim();
  cartMsg="New order"+(nm?" from "+nm:"")+":\n"+L.map(({i,q},k)=>`${k+1}. ${i.name} x${q} = ${CURRENCY}${i.price*q}`).join("\n")+"\nTotal: "+CURRENCY+tot;
  const a=$("waOrder");
  if(WHATSAPP){a.style.display="block";a.href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(cartMsg)}else a.style.display="none";
}
function toggleFav(id){
  favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];
  try{localStorage.setItem("favs",JSON.stringify(favs))}catch{}
  toast(favs.includes(id)?"Saved":"Removed from saved");renderCats();render();
}
let items=[], pics=[], isAdmin=false, cat="", sort="new";
$("grid").innerHTML=Array(6).fill('<div class="sk"><i></i><i></i><i></i></div>').join("");

document.title = SHOP_NAME;
$("logo").firstChild.textContent = SHOP_NAME;
$("bTitle").textContent = "Welcome to " + SHOP_NAME;
$("foot").innerHTML = `<b style="color:#fff">${esc(SHOP_NAME)}</b><br>${esc(ADDRESS)}${ADDRESS&&PHONE?"<br>":""}${PHONE?`Call: <a href="tel:${esc(PHONE)}">${esc(PHONE)}</a>`:""}<br>© ${new Date().getFullYear()} ${esc(SHOP_NAME)}`;

function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2400)}
const disc = i => i.mrp>i.price ? Math.round((i.mrp-i.price)/i.mrp*100) : 0;
const isNew = i => i.createdAt && Date.now()-i.createdAt.toMillis() < 7*864e5;

/* ---- image compression: max 800px, JPEG, ~120KB ---- */
function compressImage(file,maxSide=640,targetKB=40){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.width,h=img.height,s=Math.min(1,maxSide/Math.max(w,h));
      w=Math.round(w*s);h=Math.round(h*s);
      let d;
      for(let t=0;t<6;t++){
        const c=document.createElement("canvas");c.width=w;c.height=h;
        const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
        let q=.7;d=c.toDataURL("image/jpeg",q);
        while(d.length*.75/1024>targetKB&&q>.3){q-=.08;d=c.toDataURL("image/jpeg",q)}
        if(d.length*.75/1024<=targetKB||Math.max(w,h)<=320)break;
        w=Math.round(w*.85);h=Math.round(h*.85);
      }
      URL.revokeObjectURL(url);res({data:d,before:file.size,after:Math.round(d.length*.75)});
    };
    img.onerror=rej;img.src=url;
  });
}
$("camBtn").onclick=()=>openCam();
$("galBtn").onclick=()=>$("fImg").click();
async function addFiles(fs){
  if(!fs.length)return;
  const room=MAXPICS-pics.length;
  if(room<=0)return toast("Maximum "+MAXPICS+" photos");
  if(fs.length>room)toast("Only "+room+" more photo(s) allowed");
  $("pinfo").textContent="Compressing...";
  for(const f of fs.slice(0,room)){
    try{const r=await compressImage(f);pics.push(r.data)}catch{toast("Could not read a photo")}
  }
  renderThumbs();
}
$("fImg").onchange=$("fCam").onchange=e=>{const fs=[...e.target.files];e.target.value="";addFiles(fs)};

/* ---- in-page live camera (works inside app/WebView when camera permission is granted) ---- */
let stream=null,facing="environment";
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function updCam(msg){
  $("camThumbs").innerHTML=pics.map(p=>`<img src="${p}" alt="">`).join("");
  $("camInfo").innerHTML=(msg?'<b style="color:#4caf50;font-size:15px">&#10003; '+msg+'</b><br>':'')+pics.length+"/"+MAXPICS+" photos added";
  $("shot").innerHTML="&#128248; Capture"+(pics.length?" ("+pics.length+")":"");
}
function closeCam(){stopCam();$("camModal").classList.remove("on")}
async function openCam(){
  if(pics.length>=MAXPICS)return toast("Maximum "+MAXPICS+" photos");
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))return $("fCam").click();
  try{
    stopCam();
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:960}},audio:false});
    $("cv").srcObject=stream;
    try{await $("cv").play()}catch{}
    updCam();
    $("camModal").classList.add("on");
  }catch(e){console.error(e);toast("Camera blocked. Opening file picker instead");$("fCam").click()}
}
$("flip").onclick=()=>{facing=facing==="environment"?"user":"environment";openCam()};
$("camDone").onclick=closeCam;
$("shot").onclick=()=>{
  const v=$("cv");if(!v.videoWidth)return toast("Camera not ready");
  const fl=$("flash");fl.classList.remove("go");void fl.offsetWidth;fl.classList.add("go");if(navigator.vibrate)navigator.vibrate(60);
  const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;
  c.getContext("2d").drawImage(v,0,0);
  c.toBlob(async b=>{
    try{const r=await compressImage(b);pics.push(r.data);renderThumbs();updCam("Photo "+pics.length+" saved")}
    catch{toast("Capture failed")}
    if(pics.length>=MAXPICS){toast(MAXPICS+" photos added");closeCam()}
  },"image/jpeg",.92);
};
function renderThumbs(){
  $("thumbs").innerHTML=pics.map((p,k)=>`<div class="th"><img src="${p}" data-c="${k}" alt=""><button type="button" data-r="${k}">&times;</button><em>Cover</em></div>`).join("");
  const kb=Math.round(pics.reduce((a,p)=>a+p.length*.75,0)/1024);
  $("pinfo").textContent=pics.length?`${pics.length}/${MAXPICS} photos, total ${kb} KB. Tap a photo to make it the cover.`:"";
}
$("thumbs").onclick=e=>{
  const r=e.target.dataset.r,c=e.target.dataset.c;
  if(r!==undefined){pics.splice(+r,1);renderThumbs()}
  else if(c!==undefined&&+c>0){pics.unshift(pics.splice(+c,1)[0]);renderThumbs()}
};

/* ---- live data ---- */
db.collection("items").orderBy("createdAt","desc").onSnapshot(s=>{
  items=s.docs.map(d=>({id:d.id,...d.data()}));
  renderCats();render();renderAdmin();
},e=>{console.error(e);$("grid").innerHTML='<div class="empty">'+(e.code==="permission-denied"?"<b>Access denied</b>Open Firebase, then Firestore, then Rules, and publish the rules.":"<b>Could not connect</b>Check your internet and Firebase config.")+'</div>'});

function renderCats(){
  const cs=[...new Set(items.map(i=>i.category).filter(Boolean))].sort();
  $("cats").innerHTML=['<button class="chip'+(cat===""?' on':'')+'" data-c="">All</button>','<button class="chip'+(cat==="__fav"?' on':'')+'" data-c="__fav">&#9829; Saved'+(favs.length?' ('+favs.length+')':'')+'</button>']
    .concat(cs.map(c=>`<button class="chip${cat===c?' on':''}" data-c="${esc(c)}">${esc(c)}</button>`)).join("");
  $("catList").innerHTML=cs.map(c=>`<option value="${esc(c)}">`).join("");
}
$("cats").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.dataset.c;renderCats();render()};
document.querySelector(".sort").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;sort=b.dataset.s;
  document.querySelectorAll(".sort button").forEach(x=>x.classList.toggle("on",x===b));render();
};
$("q").oninput=render;

function render(){
  const q=$("q").value.toLowerCase().trim();
  let l=items.filter(i=>(!cat||(cat==="__fav"?favs.includes(i.id):i.category===cat))&&(!q||(i.name+" "+(i.category||"")).toLowerCase().includes(q)));
  if(sort==="low")l.sort((a,b)=>a.price-b.price);
  else if(sort==="high")l.sort((a,b)=>b.price-a.price);
  else if(sort==="disc")l.sort((a,b)=>disc(b)-disc(a));
  $("count").textContent=l.length+" item"+(l.length===1?"":"s");updCart();
  $("stats").innerHTML=`<span>${items.length} items</span><span>${new Set(items.map(i=>i.category).filter(Boolean)).size} categories</span>`+(items.some(i=>disc(i))?`<span>Discounts available</span>`:"");
  $("grid").innerHTML=l.length?l.map(i=>`
   <div class="card" data-id="${i.id}">
    <div class="im"><img src="${i.image||""}" alt="" loading="lazy" onload="this.classList.add('ld')" onerror="this.classList.add('ld')">${isNew(i)?'<span class="new">NEW</span>':''}<button class="fav${favs.includes(i.id)?' on':''}" data-f="${i.id}" aria-label="Save">${favs.includes(i.id)?'&#9829;':'&#9825;'}</button>${(i.images||[]).length>1?`<span class="cnt">${i.images.length} photos</span>`:''}${i.stock===false?'<div class="oos">Out of Stock</div>':''}</div>
    <div class="bd"><div class="ct">${esc(i.category||"")}</div><div class="nm">${esc(i.name)}</div>
    <div class="pr"><b>${CURRENCY}${i.price}</b>${disc(i)?`<s>${CURRENCY}${i.mrp}</s><em>${disc(i)}% off</em>`:''}</div>${cartBtn(i)}</div>
   </div>`).join(""):`<div class="empty">${items.length?(cat==="__fav"?'No saved items yet. Tap the heart on any item.':'No items match your search.'):'<div style="font-size:42px">&#128717;</div><b>Items coming soon</b>Please check back shortly.'}</div>`;
}

/* ---- detail ---- */
$("grid").onclick=e=>{
  const f=e.target.closest(".fav");if(f){e.stopPropagation();toggleFav(f.dataset.f);return}
  if(cartAct(e))return;
  const c=e.target.closest(".card");if(!c)return;
  const i=items.find(x=>x.id===c.dataset.id);if(!i)return;
  const msg=encodeURIComponent(`Hi, I'm interested in ${i.name} (${CURRENCY}${i.price})`);
  const gl=i.images&&i.images.length?i.images:[i.image||""];
  $("det").innerHTML=`<div><img id="gMain" src="${gl[0]}" alt="">${gl.length>1?`<div class="gth">${gl.map((g,k)=>`<img src="${g}" data-k="${k}" class="${k?'':'on'}" alt="">`).join("")}</div>`:''}</div><div>
    <div class="ct">${esc(i.category||"")}</div><h2>${esc(i.name)}</h2>
    <div class="pr"><b>${CURRENCY}${i.price}</b>${disc(i)?`<s>${CURRENCY}${i.mrp}</s><em>${disc(i)}% off</em>`:''}</div>
    <span class="stk" style="color:${i.stock===false?'var(--red)':'var(--green)'}">${i.stock===false?'Out of stock':'In stock'}</span>
    ${i.desc?`<p>${esc(i.desc)}</p>`:''}
    <div class="act"><button class="btn or" id="dAdd"${i.stock===false?' disabled':''}>&#128722; Add to Cart</button>${WHATSAPP?`<a class="btn wa" target="_blank" href="https://wa.me/${esc(WHATSAPP)}?text=${msg}">Enquire on WhatsApp</a>`:''}
    ${PHONE?`<a class="btn or" href="tel:${esc(PHONE)}">Call Shop</a>`:''}<button class="btn gh" id="shr">Share</button></div></div>`;
  $("shr").onclick=async()=>{
    const t=`${i.name} - ${CURRENCY}${i.price} at ${SHOP_NAME}`;
    try{ if(navigator.share) await navigator.share({title:i.name,text:t,url:location.href});
         else{await navigator.clipboard.writeText(t+" "+location.href);toast("Copied")} }catch{}
  };
  let sx=0,gi=0;const gm=$("gMain"),setG=k=>{gi=(k+gl.length)%gl.length;gm.src=gl[gi];document.querySelectorAll(".gth img").forEach((x,j)=>x.classList.toggle("on",j===gi))};
  gm.ontouchstart=e=>{sx=e.touches[0].clientX};
  gm.ontouchend=e=>{const d=e.changedTouches[0].clientX-sx;if(gl.length>1&&Math.abs(d)>40)setG(gi+(d<0?1:-1))};
  document.querySelectorAll(".gth img").forEach(t=>t.onclick=()=>setG(+t.dataset.k));
  $("dAdd").onclick=()=>{setQty(i.id,(cart[i.id]||0)+1);toast("Added to cart")};
  $("itemModal").classList.add("on");document.body.classList.add("lock");
};
const closeAll=()=>{stopCam();document.querySelectorAll(".modal").forEach(m=>m.classList.remove("on"));document.body.classList.remove("lock")};
$("mClose").onclick=closeAll;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll()});
$("itemModal").onclick=e=>{if(e.target.id==="itemModal")closeAll()};

/* ---- admin ---- */
function showAdmin(on){
  $("admin").style.display=on?"block":"none";$("store").style.display=on?"none":"block";
  $("adminBtn").textContent=on?"View Shop":"Admin";window.scrollTo(0,0);
}
$("adminBtn").onclick=()=>{
  if(isAdmin){showAdmin($("admin").style.display!=="block")}
  else{$("loginModal").classList.add("on");$("lPass").focus()}
};
$("loginClose").onclick=()=>$("loginModal").classList.remove("on");
$("loginBtn").onclick=()=>{
  if($("lPass").value===ADMIN_PASSWORD){isAdmin=true;$("lPass").value="";$("loginModal").classList.remove("on");showAdmin(true)}
  else toast("Wrong password");
};
$("lPass").onkeydown=e=>{if(e.key==="Enter")$("loginBtn").click()};
$("logoutBtn").onclick=()=>{isAdmin=false;showAdmin(false)};

function resetForm(){
  ["editId","fName","fPrice","fMrp","fCat","fImg","fCam","fDesc"].forEach(i=>$(i).value="");
  $("fStock").checked=true;pics=[];renderThumbs();
  $("saveBtn").textContent="Save Item";$("formTitle").textContent="Add New Item";$("cancelEdit").style.display="none";
}
$("cancelEdit").onclick=resetForm;

$("saveBtn").onclick=async()=>{
  const name=$("fName").value.trim(),price=$("fPrice").value,id=$("editId").value,mrp=$("fMrp").value;
  if(!name||price==="")return toast("Enter name and price");
  if(!pics.length)return toast("Add at least one photo");
  if(pics.reduce((a,p)=>a+p.length,0)>900000)return toast("Photos too large, remove one");
  const data={name,price:Number(price),mrp:mrp?Number(mrp):0,category:$("fCat").value.trim(),desc:$("fDesc").value.trim(),stock:$("fStock").checked};
  data.images=pics;data.image=pics[0];
  $("saveBtn").disabled=true;
  try{
    if(id)await db.collection("items").doc(id).update(data);
    else{data.createdAt=firebase.firestore.FieldValue.serverTimestamp();await db.collection("items").add(data)}
    toast("Saved");resetForm();
  }catch(e){console.error(e);toast(e.code==="permission-denied"?"Permission denied. Publish Firestore rules first.":"Save failed: "+(e.message||"try again"))}
  $("saveBtn").disabled=false;
};

function renderAdmin(){
  const aq=($("aq").value||"").toLowerCase(),L=items.filter(i=>!aq||(i.name+" "+(i.category||"")).toLowerCase().includes(aq));
  const out=items.filter(i=>i.stock===false).length;
  $("n").textContent=items.length;
  $("stg").innerHTML=`<div><b>${items.length}</b><span>Total</span></div><div><b>${items.length-out}</b><span>In stock</span></div><div><b>${out}</b><span>Out of stock</span></div><div><b>${new Set(items.map(i=>i.category).filter(Boolean)).size}</b><span>Categories</span></div>`;
  $("adminList").innerHTML=L.length?L.map(i=>`
   <div class="li"><img src="${i.image||""}" alt="">
    <div class="t"><b>${esc(i.name)}</b><small>${CURRENCY}${i.price}${disc(i)?` (MRP ${CURRENCY}${i.mrp})`:''} · ${esc(i.category||"-")} · ${i.stock===false?'Out of stock':'In stock'}</small></div>
    <button class="mini" data-s="${i.id}">${i.stock===false?'Set in stock':'Set out'}</button>
    <button class="mini" data-e="${i.id}">Edit</button>
    <button class="mini del" data-d="${i.id}">Delete</button></div>`).join(""):'<div class="empty">No items yet.</div>';
}
$("aq").oninput=renderAdmin;
$("cartBtn").onclick=()=>{renderCart();$("cartModal").classList.add("on");document.body.classList.add("lock")};
$("cartClose").onclick=closeAll;
$("cartModal").onclick=e=>{if(e.target.id==="cartModal")closeAll()};
$("cartList").onclick=cartAct;
$("cName").oninput=renderCart;
$("cCopy").onclick=async()=>{try{await navigator.clipboard.writeText(cartMsg);toast("Order list copied")}catch{toast("Could not copy")}};
$("cClear").onclick=()=>{if(confirm("Clear the cart?")){cart={};try{localStorage.setItem("cart","{}")}catch{}render();renderCart()}};
addEventListener("scroll",()=>$("up").classList.toggle("on",scrollY>500));
$("up").onclick=()=>scrollTo({top:0,behavior:"smooth"});
$("foot").innerHTML=`<div style="font-size:18px;font-weight:700;color:#fff">${esc(SHOP_NAME)}</div><div style="opacity:.8;margin:4px 0 12px">Quality products at the best prices</div>${ADDRESS?`<div>&#128205; ${esc(ADDRESS)}</div>`:''}<div style="margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">${PHONE?`<a class="btn or" href="tel:${esc(PHONE)}">&#128222; Call</a>`:''}${WHATSAPP?`<a class="btn wa" target="_blank" href="https://wa.me/${esc(WHATSAPP)}">WhatsApp</a>`:''}</div><div style="margin-top:14px;opacity:.6">&copy; ${new Date().getFullYear()} ${esc(SHOP_NAME)}</div>`;
$("adminList").onclick=async e=>{
  const {e:eid,d:did,s:sid}=e.target.dataset;
  if(sid){try{const i=items.find(x=>x.id===sid);await db.collection("items").doc(sid).update({stock:i.stock===false})}catch{toast("Could not update")}}
  if(eid){const i=items.find(x=>x.id===eid);
    $("editId").value=i.id;$("fName").value=i.name;$("fPrice").value=i.price;$("fMrp").value=i.mrp||"";
    $("fCat").value=i.category||"";$("fDesc").value=i.desc||"";$("fStock").checked=i.stock!==false;
    pics=(i.images&&i.images.length?i.images:(i.image?[i.image]:[])).slice();renderThumbs();
    $("saveBtn").textContent="Update Item";$("formTitle").textContent="Edit Item";$("cancelEdit").style.display="block";scrollTo({top:0,behavior:"smooth"})}
  if(did&&confirm("Delete this item?")){try{await db.collection("items").doc(did).delete();toast("Deleted")}catch{toast("Could not delete")}}
};
</script>
