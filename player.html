<!<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Lookup Scanner</title>
  <style>
    /* --- CSS Styling --- */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #333;
      background: #252525;
      color: #fff;
      border-radius: 4px;
      font-size: 16px;
    }
    button {
      padding: 12px 24px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled {
      background: #444;
      cursor: not-allowed;
    }
    .error-msg {
      color: #ff6b6b;
      background: rgba(255,107,107,0.1);
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      display: none;
    }
    .error-msg.show { display: block; }
    .results-box { display: none; }
    .results-box.show { display: block; }
    .result-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #333;
    }
    .result-label { color: #888; font-weight: 500; }
    .result-value { color: #fff; }
    .logs-box {
      margin-top: 20px;
      background: #151515;
      padding: 10px;
      border-radius: 4px;
      max-height: 150px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 13px;
    }
    .log-entry { margin-bottom: 5px; }
    .log-success { color: #2ecc71; }
    .log-error { color: #e74c3c; }
    pre {
      background: #151515;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Phone OSINT Scanner</h2>
    
    <!-- Input Field and Button -->
    <div class="search-box">
      <input type="text" id="phoneNum" placeholder="Enter Phone Number (e.g. +919876543210)">
      <button id="scanBtn" onclick="scanPhone()">SCAN</button>
    </div>

    <!-- Error Message Display -->
    <div id="errorMsg" class="error-msg"></div>

    <!-- Results Box -->
    <div id="resultsBox" class="results-box">
      <h3>Scan Results</h3>
      <div id="resultItems"></div>
      
      <h3>Raw JSON Data</h3>
      <pre id="rawJson"></pre>
    </div>

    <!-- Console/Activity Logs -->
    <h3>Activity Logs</h3>
    <div id="logsBox" class="logs-box"></div>
  </div>

  <!-- --- JAVASCRIPT LOGIC --- -->
  <script>
    // Global Variables (Counter aur Limits)
    let currentCount = 0;
    const MAX_SEARCHES = 10;

    // Custom Logger Function
    function addLog(message, type) {
      const logsBox = document.getElementById('logsBox');
      if (!logsBox) return;
      
      const entry = document.createElement('div');
      entry.className = `log-entry ${type === 'success' ? 'log-success' : 'log-error'}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logsBox.appendChild(entry);
      logsBox.scrollTop = logsBox.scrollHeight; // Auto scroll down
    }

    // Counter increment logic
    function incrementSearchCount() {
      currentCount++;
    }

    // Main Scan Function
    async function scanPhone() {
      const phoneInput = document.getElementById('phoneNum');
      const phone = phoneInput ? phoneInput.value.trim() : '';
      const btn = document.getElementById('scanBtn');
      const errorMsg = document.getElementById('errorMsg');
      const resultsBox = document.getElementById('resultsBox');

      if (!phone) {
        alert('Please enter a phone number');
        return;
      }

      if (currentCount >= MAX_SEARCHES) {
        alert('Search limit reached!');
        addLog('Failed: Search limit reached', 'error');
        return;
      }

      // UI Reset and Loading State
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'SCANNING...';
      }
      if (errorMsg) errorMsg.classList.remove('show');

      try {
        addLog(`Initiating scan for: ${phone}`, 'success');

        // Note: Apni sahi API URL yahan lagayein
        const response = await fetch(`https://api.example.com/scan?phone=${phone}`);
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        addLog('Data received successfully', 'success');

        // Increment count on success
        incrementSearchCount();

        // Render Results
        showResults(data, phone);
        if (resultsBox) resultsBox.classList.add('show');
        
        addLog(`Scan completed (${currentCount}/${MAX_SEARCHES} used)`, 'success');

      } catch (err) {
        if (errorMsg) {
          errorMsg.textContent = '❌ API Error: ' + err.message;
          errorMsg.classList.add('show');
        }
        addLog('Failed: ' + err.message, 'error');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'SCAN';
        }
      }
    }

    // Display parsed data inside UI elements
    function showResults(data, phone) {
      const resultItems = document.getElementById('resultItems');
      const rawJson = document.getElementById('rawJson');

      if (!resultItems) return;
      resultItems.innerHTML = '';

      // Mapping incoming keys from API response
      const fields = {
        'Phone': phone,
        'Country': data.country || 'N/A',
        'Carrier': data.carrier || 'N/A',
        'Type': data.type || 'N/A',
        'City': data.city || 'N/A',
        'Region': data.region || 'N/A',
        'Status': data.status || 'Active',
        'Valid': data.valid !== undefined ? (data.valid ? 'Yes' : 'No') : 'N/A'
      };

      for (const [key, value] of Object.entries(fields)) {
        const item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML = `
          <div class="result-label">${key}</div>
          <div class="result-value">${value}</div>
        `;
        resultItems.appendChild(item);
      }

      if (rawJson) {
        rawJson.textContent = JSON.stringify(data, null, 2);
      }
    }

    // Input pe Enter key press handle karne ke liye
    const phoneNumInput = document.getElementById('phoneNum');
    if (phoneNumInput) {
      phoneNumInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') scanPhone();
      });
    }
  </script>
</body>
</html>
